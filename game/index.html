<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lowtide Run</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#345c68;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#touch{display:none;position:fixed;inset:auto 14px 22px;justify-content:space-between;align-items:end;pointer-events:none;user-select:none}.pad,.actions{display:grid;gap:7px;pointer-events:auto}.pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px)}.actions{grid-template-columns:repeat(2,58px)}button{border:1px solid #ffffff55;border-radius:12px;background:#172023c9;color:#fff;font:700 17px system-ui;touch-action:none;min-width:48px;min-height:48px}.actions button{font-size:13px}@media(pointer:coarse),(max-width:700px){#touch{display:flex}}body.pause-open #touch{display:none}
</style></head><body><canvas id="game" aria-label="Lowtide Run city driving game"></canvas><div id="touch" aria-label="Touch controls"><div class="pad"><span></span><button data-control="KeyW">&#9650;</button><span></span><button data-control="KeyA">&#9664;</button><button data-control="KeyS">&#9660;</button><button data-control="KeyD">&#9654;</button></div><div class="actions"><button data-control="KeyE">E<br>USE</button><button data-control="Space">BRAKE</button><button data-control="Tab">WEAPON</button><button data-control="KeyR">RELOAD</button><button data-control="KeyF">HIT</button><button data-control="KeyP">PAUSE</button><button data-control="ShiftLeft">RUN</button></div></div><script type="module" src="./src/main.js"></script></body></html>
